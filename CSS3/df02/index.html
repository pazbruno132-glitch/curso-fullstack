<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>
    <style>
        #cabecalho{
            background-color: rgb(0, 110, 255);
        }

        #cabecalho a{
            color: white;
        }

        #cabecalho span{
            background-color: white;
            color: blue;
        }

        #principal{
            background-color: purple;
        }

        #rodape{
            background-color: rgb(0, 110, 255);
            color: white;
        }

        #rodape span{
            color: purple;
        }
    </style>
</head>
<body>
    <div id="cabecalho">
        <img src="img/logo-magalu.png" alt="" width="200">

        <a href="#">Ofertas do dia</a>
        <a href="#">Celulares</a>
        <a href="#">Tv e Video</a>
        <a href="#">Informática</a>

        <span>compre pelo tel: 0800 70 70 70</span>
    </div>

    <div id="principal">
        <img src="img/banner.png" alt="">
    </div>

    <div id="produtos">
        <h2>Novidades que selecionamos</h2>

        <img src="img/produto1.jpg" alt="">
        <img src="img/produto2.jpg" alt="">
        <img src="img/produto3.jpg" alt="">
        <img src="img/produto4.jpg" alt="">
        <img src="img/produto5.jpg" alt="">
    </div>

    <div id="rodape">
        <p><span>Magazine luiza</span> todos os direitos reservados</p>
    </div>
</body>
</html>
